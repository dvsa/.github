name: Terraform Workspace

inputs:
  terraform_version:
    default: '1.9.8'
    description: Terraform version to install on runner
  terraform_workspace_name:
    description: Name for Terraform workspace, e.g. dev01 or uat01
  terraform_directory:
    default: '.'
    description: Directory containing the initialized Terraform configuration

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v7
      with:
        clean: false
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false
    - name: Select or create Terraform workspace
      working-directory: ${{ inputs.terraform_directory }}
      env:
        INPUT_WORKSPACE: ${{ inputs.terraform_workspace_name }}
        ACTOR: ${{ github.actor }}
      run: |
        workspace="${INPUT_WORKSPACE:-$ACTOR}"
        terraform workspace select "$workspace" || terraform workspace new "$workspace"
        echo "WORKSPACE=$workspace" >> "$GITHUB_ENV"
      shell: bash
