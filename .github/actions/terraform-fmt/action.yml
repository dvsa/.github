name: Terraform Format

inputs:
  terraform_version:
    default: '1.9.8'
    description: Terraform version to install
  check:
    required: false
    default: 'true'
    description: Flag whether to only report errors without making changes
  recursive:
    required: false
    default: 'true'
    description: Flag to trigger recursive checks into subfolders of project path
  path:
    required: false
    description: Target directory in which to run fmt command

runs:
  using: 'composite'
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false
    - name: Format Terraform
      env:
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_RECURSIVE: ${{ inputs.recursive }}
        INPUT_PATH: ${{ inputs.path }}
      run: |
        args=()
        if [[ "$INPUT_CHECK" == 'true' ]]; then
          args+=(-check)
        fi
        if [[ "$INPUT_RECURSIVE" == 'true' ]]; then
          args+=(-recursive)
        fi
        if [[ -n "$INPUT_PATH" ]]; then
          args+=("$INPUT_PATH")
        fi
        terraform fmt "${args[@]}"
      shell: bash
