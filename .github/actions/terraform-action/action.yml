name: Terraform Action

inputs:
  action:
    description: 'Terraform action to run e.g plan'
    required: true
  project:
    description: 'Terraform project'
    required: true
  environment:
    description: 'Terraform environment'
    required: true
  component:
    description: 'Terraform component'
    required: true
  group:
    description: 'Terraform group'
    required: true
  bucket-prefix:
    description: 'AWS Terraform bucket used for TF state'
    required: true
  region:
    description: 'AWS region'
    required: true
  terraform_version:
    default: '1.9.8'
    description: Terraform Version to install on runner
  terraform_args:
    default: ''
    description: Additional Terraform arguments
  terraform_directory:
    default: '.'
    description: Directory location of Terraform
  artifact_name:
    default: ''
    description: 'Name of the artifact to upload (defaults to environment-component if empty)'
  upload_artifact:
    default: 'true'
    description: 'Whether to upload the artifact or not'

runs:
  using: 'composite'
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version:  ${{ inputs.terraform_version }}
        terraform_wrapper: false

    - name: Terraform init and plan
      id: plan
      working-directory: ${{ inputs.terraform_directory }}
      env:
        INPUT_ACTION: ${{ inputs.action }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_GROUP: ${{ inputs.group }}
        INPUT_BUCKET_PREFIX: ${{ inputs.bucket-prefix }}
        INPUT_REGION: ${{ inputs.region }}
        INPUT_TERRAFORM_ARGS: ${{ inputs.terraform_args }}
      run: |
        set -o pipefail
        if [[ ! -x ./bin/terraform.sh || ! -f ./bin/terraform.sh ]]; then
          echo "::error::./bin/terraform.sh is missing or not executable in the Terraform directory."
          exit 1
        fi
        args=()
        if [[ -n "$INPUT_TERRAFORM_ARGS" ]]; then
          parsed_args=$(python3 -c 'import json, os, shlex; print(json.dumps(shlex.split(os.environ["INPUT_TERRAFORM_ARGS"])))')
          while IFS= read -r -d '' arg; do
            args+=("$arg")
          done < <(python3 -c 'import json, sys; [sys.stdout.buffer.write(arg.encode() + b"\0") for arg in json.loads(sys.argv[1])]' "$parsed_args")
        fi
        mkdir -p "plans/$INPUT_ENVIRONMENT"
        ./bin/terraform.sh \
          --action "$INPUT_ACTION" \
          --project "$INPUT_PROJECT" \
          --environment "$INPUT_ENVIRONMENT" \
          --component "$INPUT_COMPONENT" \
          --group "$INPUT_GROUP" \
          --bucket-prefix "$INPUT_BUCKET_PREFIX" \
          --region "$INPUT_REGION" \
          --compact-warnings --no-color -- "${args[@]}" \
          | tee "plans/$INPUT_ENVIRONMENT/$INPUT_COMPONENT-plan.txt"
      shell: bash

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Save Artifact
      if: ${{ inputs.upload_artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: "${{ inputs.artifact_name != '' && format('{0}-{1}-{2}-{3}', inputs.environment, inputs.component, inputs.artifact_name, steps.date.outputs.date) || format('{0}-{1}-{2}', inputs.environment, inputs.component, steps.date.outputs.date) }}"
        path: "${{ inputs.terraform_directory }}/plans/${{ inputs.environment }}/${{ inputs.component }}-plan.txt"
        retention-days: 7
