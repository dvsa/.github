name: Install dependencies
description: Install Node, NPM and all project dependencies.

inputs:
  node-version:
    description: >-
      Node version used to install dependencies. Leave empty (the default) to use the project's .nvmrc,
      or the latest Node if there isn't one.
    type: string
    required: false
    default: ''
  npm-version:
    description: NPM version to be installed and used
    type: string
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    # An explicit node-version wins; otherwise the project's .nvmrc; otherwise the latest Node
    - name: Choose Node version
      id: node
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        if [ -n "$NODE_VERSION" ]; then
          echo "Using the node-version input: $NODE_VERSION"
          echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
        elif [ -f .nvmrc ]; then
          echo "Using .nvmrc: $(head -n 1 .nvmrc)"
          echo "file=.nvmrc" >> "$GITHUB_OUTPUT"
        else
          echo "No node-version input or .nvmrc, so using the latest Node"
          echo "version=latest" >> "$GITHUB_OUTPUT"
        fi
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.node.outputs.version }}
        node-version-file: ${{ steps.node.outputs.file }}
        cache: 'npm'
    - run: npm i -g npm@${{ inputs.npm-version }}
      shell: bash
    - run: node --version
      shell: bash
    - run: npm --version
      shell: bash

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: npm-${{ hashFiles('package-lock.json') }}
        restore-keys: npm-

    - name: Install dependencies
      run: npm ci --prefer-offline
      shell: bash
