name: Security

on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: true
    inputs:
      php-versions:
        required: true
        type: string
      fail-fast:
        required: false
        default: true
        type: boolean
      severity-threshold:
        required: false
        type: string
      composer-version:
        required: false
        type: string
        default: 'v2'

jobs:
  snyk:
    permissions:
      security-events: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    name: Snyk PHP Scan
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
        stability: [prefer-lowest, prefer-stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:${{ inputs.composer-version }}
          coverage: none
          extensions: mbstring

      - name: Composer install
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/php@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SEVERITY_THRESHOLD: ${{ inputs.severity-threshold && format('--severity-threshold={0}', inputs.severity-threshold) || '' }}
        with:
          args: --sarif-file-output=snyk.sarif $SEVERITY_THRESHOLD

      - name: Check if the repository is private
        uses: octokit/graphql-action@v3.x
        id: is-private
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          query: |
            query release($owner:String!,$repo:String!) {
              repository(owner:$owner,name:$repo) {
                isPrivate
              }
            }
          variables: |
            owner: ${{ github.repository_owner }}
            repo: ${{ github.event.repository.name }}

      - name: Upload result to GitHub Code Scanning
        if: ${{ fromJSON(steps.is-private.outputs.data).repository.isPrivate  == false  }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
