name: Update SSM parameter action

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      parameter-name:
        description: Full name of the Parameter Store parameter
        required: true
        type: string
      parameter-type:
        required: false
        type: string
        default: String
      parameter-value-variable:
        description: Name of an environment variable holding the value. Used instead of the PARAMETER_VALUE secret when set
        required: false
        type: string
        default: ''
      role-name:
        description: IAM role name to assume in the environment's account (AWS_ACCOUNT_ID variable). Used when the AWS_ROLE_TO_ASSUME_ARN secret is not set
        required: false
        type: string
        default: ''
    secrets:
      AWS_REGION:
        required: false
      AWS_ROLE_TO_ASSUME_ARN:
        required: false
      PARAMETER_VALUE:
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
    steps:
      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_ARN || format('arn:aws:iam::{0}:role/{1}', vars.AWS_ACCOUNT_ID, inputs.role-name) }}
          role-session-name: GithubActionsSession
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
      - name: Update SSM parameter
        env:
          PARAMETER_NAME: ${{ inputs.parameter-name }}
          PARAMETER_TYPE: ${{ inputs.parameter-type }}
          PARAMETER_VALUE: ${{ inputs.parameter-value-variable != '' && vars[inputs.parameter-value-variable] || secrets.PARAMETER_VALUE }}
        run: |
          if [[ -z "$PARAMETER_VALUE" ]]; then
            echo "::error::No value supplied for $PARAMETER_NAME"
            exit 1
          fi
          aws ssm put-parameter --name "$PARAMETER_NAME" --value "$PARAMETER_VALUE" --type "$PARAMETER_TYPE" --overwrite 
          echo "Updated $PARAMETER_NAME"
