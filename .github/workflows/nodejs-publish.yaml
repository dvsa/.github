name: Publish

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: ''
      download-artifact:
        required: false
        type: boolean
        default: false
      build-folder:
        required: false
        type: string
        default: 'package'
      build-folder-path:
        required: false
        type: string
        default: 'dist'
      args:
        required: false
        type: string
    secrets:
      NPM_AUTH_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # As actions/install-deps: an explicit node-version wins; otherwise the project's .nvmrc; otherwise the latest Node
      - name: Choose Node version
        id: node
        env:
          NODE_VERSION: ${{ inputs.node-version }}
        run: |
          if [ -n "$NODE_VERSION" ]; then
            echo "Using the node-version input: $NODE_VERSION"
            echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -f .nvmrc ]; then
            echo "Using .nvmrc: $(head -n 1 .nvmrc)"
            echo "file=.nvmrc" >> "$GITHUB_OUTPUT"
          else
            echo "No node-version input or .nvmrc, so using the latest Node"
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          node-version-file: ${{ steps.node.outputs.file }}
          registry-url: 'https://registry.npmjs.org'
      - name: Download build artifact
        if: inputs.download-artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.build-folder }}
          path: ${{ inputs.build-folder-path }}
      - name: Publish to npm.js
        run: npm publish ${{ inputs.args }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
